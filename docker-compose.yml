# CollabMD + Cloudflare Quick Tunnel for the D&D campaign vault.
# Start with:  .\start-campaign.ps1
services:
  collabmd:
    image: ghcr.io/andes90/collabmd:latest
    container_name: collabmd
    restart: unless-stopped
    environment:
      # Password is read from .env (never commit that file).
      AUTH_STRATEGY: password
      AUTH_PASSWORD: ${COLLABMD_PASSWORD:?set COLLABMD_PASSWORD in .env}
      # Keep players signed in for 30 days so they aren't re-typing the password every session.
      AUTH_SESSION_MAX_AGE_MS: "2592000000"
      GIT_AUTHOR_NAME: CollabMD
      GIT_AUTHOR_EMAIL: collabmd@localhost
    command: ["/data", "--no-tunnel", "--auth", "password"]
    volumes:
      - ./vault:/data
    expose:
      - "1234"
    ports:
      # Local access for you, so you can use the browser editor without the tunnel.
      - "127.0.0.1:1234:1234"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: collabmd-tunnel
    restart: unless-stopped
    depends_on:
      - collabmd
    # Quick Tunnel: no Cloudflare account needed. The URL is random and
    # changes every restart -- read it from this container's logs.
    command: tunnel --no-autoupdate --url http://collabmd:1234
