# CollabMD + Cloudflare Quick Tunnel for the D&D campaign vault.
# Start with:  .\start-campaign.ps1
services:
  collabmd:
    image: ghcr.io/andes90/collabmd:latest
    container_name: collabmd
    restart: unless-stopped
    environment:
      # Vault path inside the container (./vault is mounted here).
      COLLABMD_VAULT_DIR: /data
      # Shared password auth. Values come from .env -- never commit that file.
      AUTH_STRATEGY: password
      AUTH_PASSWORD: ${COLLABMD_PASSWORD:?set COLLABMD_PASSWORD in .env}
      # Stable secret so players stay signed in across restarts of this stack.
      AUTH_SESSION_SECRET: ${COLLABMD_SESSION_SECRET:?set COLLABMD_SESSION_SECRET in .env}
      # 30 days, so nobody re-types the password every session.
      AUTH_SESSION_MAX_AGE_MS: "2592000000"
      # In-browser git commits are attributed to the vault, not a person.
      COLLABMD_GIT_ENABLED: "true"
      COLLABMD_GIT_USER_NAME: CollabMD
      COLLABMD_GIT_USER_EMAIL: collabmd@localhost
    volumes:
      - ./vault:/data
    ports:
      # Local access for you, without going through the tunnel.
      - "127.0.0.1:1234:1234"
    # Image default command is already `node bin/collabmd.js --no-tunnel`;
    # cloudflared below provides the tunnel instead.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: collabmd-tunnel
    restart: unless-stopped
    depends_on:
      - collabmd
    # Quick Tunnel: no Cloudflare account needed. The URL is random and
    # changes every restart -- start-campaign.ps1 reads it from these logs.
    command: tunnel --no-autoupdate --url http://collabmd:1234
